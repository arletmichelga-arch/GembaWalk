function sxTxt(v, max) {

// Valida y normaliza un hallazgo NUEVO que llega del celular
function sxValidarNuevo(d, ahora) {
  const id = String(d.id || '');
  if (!ID_RE.test(id)) return { error: 'datos' };
  const tipo = sxTxt(d.tipo, 40);
  const lugar = sxTxt(d.lugar, 90);
  if (!TIPOS_N.includes(tipo) || !lugar) return { error: 'datos' };
  const ah = ahora || sxAhoraMX();
  let fecha = sxFecha(d.fecha) ? d.fecha : ah.fecha;
  if (fecha < sxSuma(ah.fecha, -14) || fecha > sxSuma(ah.fecha, 1)) fecha = ah.fecha;
  const hora = sxHora(d.hora) ? d.hora : ah.hora;
  const lid = Number.isFinite(Number(d.lid)) && Number(d.lid) > 0 ? Math.floor(Number(d.lid)) : 0;
  return {

// Valida los cambios que hace la administradora sobre un hallazgo (lista blanca de campos)
function sxValidarCambios(c) {

  if ('est' in c) { if (!ESTADOS.includes(c.est)) return { error: 'datos' }; o.est = c.est; }
  if ('crit' in c) { if (!CRITS.includes(c.crit || '')) return { error: 'datos' }; o.crit = c.crit || ''; }
  if ('cierre_tipo' in c) { if (!CIERRES.includes(c.cierre_tipo || '')) return { error: 'datos' }; o.cierre_tipo = c.cierre_tipo || ''; }
  if ('causa' in c) { const v = sxTxt(c.causa, 40); if (v && !CAUSAS.includes(v)) return { error: 'datos' }; o.causa = v; }
  if ('muda' in c) { const v = sxTxt(c.muda, 40); if (v && !MUDAS.includes(v)) return { error: 'datos' }; o.muda = v; }
  if ('tipo' in c) { const v = sxTxt(c.tipo, 40); if (!TIPOS_N.includes(v)) return { error: 'datos' }; o.tipo = v; }
  if ('lid' in c) { const n = Math.floor(Number(c.lid)); o.lid = Number.isFinite(n) && n > 0 ? n : 0; }
  for (const k of ['comp', 'cierre']) {

  }

}

// Reglas de coherencia al guardar (cierre/estado) y bitácora legible
function sxAplicarCambios(row, c, quien, hoy, iso) {

  } else {
    n.cierre = ''; n.cierre_tipo = ''; n.cierre_por = '';

  const cambios = [];
  const lab = (k, v) => (k === 'est' ? ETQ_EST[v] : k === 'crit' ? ETQ_CRIT[v || ''] : k === 'cierre_tipo' ? ETQ_CIERRE[v || ''] : v || '—');
  const nombres = { est: 'Estatus', crit: 'Criticidad', resp_area: 'Área responsable', resp_nom: 'Responsable', comp: 'Fecha compromiso', cierre_tipo: 'Tipo de cierre', tipo: 'Tipo', lugar: 'Lugar', dup_de: 'Duplicado de' };
  for (const k in nombres) {

function aCfgSanear(c) {
  const o = aCfgDef(); c = c && typeof c === 'object' ? c : {};

    for (const a of c.areas.slice(0, 60)) {

    const r = c.rotacion;
    const sem = Array.isArray(r.semanas) ? r.semanas.slice(0, 8).map((w) => {
      const dias = Array.isArray(w) ? w.slice(0, 5) : [];
      while (dias.length < 5) dias.push([]);
      return dias.map((d) => (Array.isArray(d) ? d : []).map((x) => Math.floor(Number(x))).filter((n) => n > 0).slice(0, 8));
    }) : [];
    o.rotacion = { inicio: sxFecha(r.inicio) ? r.inicio : o.rotacion.inicio, semanas: sem.length ? sem : o.rotacion.semanas };
  }
  if (Array.isArray(c.feriados)) o.feriados = Array.from(new Set(c.feriados.filter(sxFecha))).sort().slice(0, 300);
  if (c.metas && typeof c.metas === 'object') for (const k of Object.keys(o.metas)) { const n = Number(c.metas[k]); if (Number.isFinite(n) && n >= 0 && n <= 100) o.metas[k] = Math.round(n); }

async function aLimiteVer(R, X, claves, max) {
  for (const [k, m] of claves) {

}

}

async function apiHandle(R, d, X) {
  d = d && typeof d === 'object' ? d : {};
  const a = String(d.a || '');
  try {
    const ah = sxAhoraMX(X.ms), iso = new Date(X.ms).toISOString();
    // ---------- públicas ----------
    if (a === 'ping') return { ok: true, v: GW_VER, srv: X.srv || 'worker', init: (await R.adminCount()) > 0, hoy: ah.fecha };
    if (a === 'config') {
      const cfg = await aCfgGet(R);
      return { ok: true, areas: cfg.areas.map((x) => x.n), cod: !!cfg.reg.codigo, aprobacion: !!cfg.reg.aprobacion, init: (await R.adminCount()) > 0 };
    }

      const num = sxNum(d.num), clave = String(d.clave || '');
      if (!num || !RE_CLAVE.test(clave)) return aErr('datos');
      if (await aLimiteVer(R, X, [['u:' + num, 1], ['i:' + X.ip, 4]], MAX_INT)) return aErr('bloqueada');
      const u = await R.userGet(num);
      if (u && u.estado === 'invitado' && !u.h) return aErr('invitado');
      const ok = u && u.h && aIgual(await aHashClave(u.sal, clave), u.h);
      if (!ok) { await aLimiteSuma(R, X, 'u:' + num); await aLimiteSuma(R, X, 'i:' + X.ip); return aErr('credenciales'); }
      if (u.estado === 'pendiente') return aErr('pendiente');
      if (u.estado !== 'activo') return aErr('baja');
      await R.rlDel('u:' + num);
      u.ult = iso; await R.userPut(u);
      return aSalida(R, X, u, await aSesionNueva(R, X, u));
    }
    if (a === 'registro') {
      if (await aLimiteVer(R, X, [['r:' + X.ip, 1]], MAX_INT * 3)) return aErr('bloqueada');
      const cfg = await aCfgGet(R);
      const num = sxNum(d.num), nombre = sxTxt(d.nombre, 80), clave = String(d.clave || '');
      if (!num || !RE_CLAVE.test(clave)) return aErr('datos');
      const area = sxTxt(d.area, 60);

      if (u && u.estado !== 'invitado') return aErr('existe');
      if ((!u || !u.nombre) && nombre.length < 3) return aErr('datos');
      if (!u || !u.area) { if (!cfg.areas.some((x) => x.n === area)) return aErr('datos'); }
      if (!u && cfg.reg.codigo && sxCodigo(d.codigo) !== sxCodigo(cfg.reg.codigo)) { await aLimiteSuma(R, X, 'r:' + X.ip); return aErr('codigo'); }
      const sal = aRand(16);

        num, nombre: u && u.nombre ? u.nombre : nombre, area: u && u.area ? u.area : area, rol: 'user',
        estado: !u && cfg.reg.aprobacion ? 'pendiente' : 'activo', sal, h: await aHashClave(sal, clave), cambiar: 0,
        creado: u ? u.creado || iso : iso, ult: '', pedido: '',
      };
      await R.userPut(nuevo);
      await aLimiteSuma(R, X, 'r:' + X.ip);
      if (nuevo.estado === 'pendiente') return { ok: true, pendiente: true };
      nuevo.ult = iso; await R.userPut(nuevo);
      return aSalida(R, X, nuevo, await aSesionNueva(R, X, nuevo));
    }
    if (a === 'olvide') {
      if (await aLimiteVer(R, X, [['o:' + X.ip, 1]], MAX_INT)) return aErr('bloqueada');
      await aLimiteSuma(R, X, 'o:' + X.ip);
      const u = await R.userGet(sxNum(d.num));
      if (u && u.rol !== 'admin' && (u.estado === 'activo' || u.estado === 'pendiente')) { u.pedido = iso; await R.userPut(u); }
      return { ok: true };
    }
    if (a === 'admin_primera') {
      if ((await R.adminCount()) > 0) return aErr('ya');
      if (await aLimiteVer(R, X, [['p:' + X.ip, 1]], 5)) return aErr('bloqueada');
      if (X.codeHash && (await sxSha256hex(sxCodigo(d.codigo))) !== X.codeHash) { await aLimiteSuma(R, X, 'p:' + X.ip); return aErr('codigo'); }
      const num = sxNum(d.num), nombre = sxTxt(d.nombre, 80), clave = String(d.clave || '');
      if (!num || nombre.length < 3 || !RE_CLAVE.test(clave)) return aErr('datos');
      const sal = aRand(16);
      const u = { num, nombre, area: sxTxt(d.area, 60) || 'Calidad', rol: 'admin', estado: 'activo', sal, h: await aHashClave(sal, clave), cambiar: 0, creado: iso, ult: iso, pedido: '' };
      await R.userPut(u);
      return aSalida(R, X, u, await aSesionNueva(R, X, u));
    }

    // ---------- con sesión ----------
    const esAdm = a.startsWith('a_');
    const A = await aAuth(R, d, X, esAdm);
    if (!A) return aErr('sesion');
    if (A.perm) return aErr('permiso');
    const u = A.u;

    if (a === 'yo') return aSalida(R, X, u, String(d.tk));
    if (a === 'salir') { await R.sesDel(A.th); return { ok: true }; }
    if (a === 'cambiar_clave') {
      const act = String(d.actual || ''), nue = String(d.nueva || '');
      if (!RE_CLAVE.test(act) || !RE_CLAVE.test(nue)) return aErr('datos');
      if (await aLimiteVer(R, X, [['u:' + u.num, 1]], MAX_INT)) return aErr('bloqueada');
      if (!aIgual(await aHashClave(u.sal, act), u.h)) { await aLimiteSuma(R, X, 'u:' + u.num); return aErr('credenciales'); }
      u.sal = aRand(16); u.h = await aHashClave(u.sal, nue); u.cambiar = 0;
      await R.userPut(u);
      return { ok: true };
    }
    if (a === 'hallazgo') {
      const v = sxValidarNuevo(d, ah);
      if (v.error) return aErr('datos');
      const fotos = (Array.isArray(d.fotos) ? d.fotos : []).slice(0, 3);
      for (const f of fotos) if (!aFotoOk(f, 420000, 30000)) return aErr('foto');
      const ya = await R.hzGet(v.h.id);
      if (ya) return { ok: true, id: ya.id, ya: true };
      let dup = '';
      if (ID_RE.test(String(d.dup_de || ''))) { const p = await R.hzGet(d.dup_de); if (p && !p.dup_de && !p.borrado) dup = p.id; }
      const row = aHzNormal(Object.assign({}, v.h, {
        num: u.num, nombre: u.nombre, area: u.area, nf: fotos.length, nfc: 0, recibido: X.ms, est: 'abierto',
        crit: CRITS.includes(d.crit) ? d.crit : '', muda: MUDAS.includes(d.muda) ? d.muda : '', resp_area: sxTxt(d.resp_area, 80),
        dup_de: dup, hist: [], borrado: 0, act: X.ms,
      }));
      if (!row) return aErr('datos');
      if (row.tipo === 'Buena práctica') { row.est = 'cerrado'; row.cierre = row.fecha; row.cierre_tipo = ''; row.cierre_por = u.nombre; row.urgente = 0; row.crit = ''; }
      else if (row.urgente && !row.crit) row.crit = 'alta';
      await R.hzPutConFotos(row, fotos.map((f, i) => ({ n: i + 1, d: f.d, m: f.m })));
      return { ok: true, id: row.id };
    }
    if (a === 'mis') {
      const desde = sxSuma(ah.fecha, -45);
      const rows = await R.hzList({ desde, num: u.num });
      return { ok: true, hz: rows.filter((r) => !r.borrado).map(aHzVista), hoy: ah.fecha };
    }
    if (a === 'similares') {
      const fecha = sxFecha(d.fecha) ? d.fecha : ah.fecha;
      const rows = (await R.hzList({ desde: fecha, hasta: fecha })).filter((r) => !r.borrado && !r.dup_de && r.fecha === fecha);
      const txt = sxTxt(d.que, 120) + ' ' + sxTxt(d.comentario, 300), lugar = sxNorm(d.lugar), tipo = String(d.tipo || '');
      const res = [];
      for (const r of rows) {
        const mismoLugar = sxNorm(r.lugar) === lugar && lugar !== '';
        const sim = sxJaccard(txt, r.que + ' ' + r.comentario);
        let pts = 0;
        if (mismoLugar) pts += 0.35;
        if (r.tipo === tipo) pts += 0.2;
        pts += sim * 0.8;
        if (mismoLugar && (sim >= 0.2 || (r.tipo === tipo && sim >= 0.1) || (r.tipo === tipo && !txt.trim()))) { if (pts >= 0.55) res.push({ pts, r }); }
        else if (sim >= 0.55) res.push({ pts, r });
      }
      res.sort((x, y) => y.pts - x.pts);
      return { ok: true, s: res.slice(0, 3).map((x) => ({ id: x.r.id, tipo: x.r.tipo, lugar: x.r.lugar, que: x.r.que, comentario: x.r.comentario, hora: x.r.hora, area: x.r.area, mio: x.r.num === u.num })) };
    }
    if (a === 'sin_novedad') {
      await R.asiPut({ fecha: ah.fecha, area: u.area, num: u.num, nombre: u.nombre, fuente: 'sin_novedad' });
      return { ok: true };
    }

    // ---------- administración ----------
    if (a === 'a_traer') {
      const cfg = await aCfgGet(R);
      const desde = d.todo ? '' : sxFecha(d.desde) ? d.desde : sxSuma(ah.fecha, -120);
      const hz = await R.hzList({ desde, hasta: sxFecha(d.hasta) ? d.hasta : '' });
      const us = await R.userAll();
      return {
        ok: true, ahora: X.ms, hoy: ah.fecha, srv: X.srv || 'worker', hz, u: us.map(aUserPub), asi: await R.asiList(desde), cfg: aCfgPub(cfg, true),
        agenda: await aAgendaGet(R),
      };
    }
    if (a === 'a_minis') {
      const ids = (Array.isArray(d.ids) ? d.ids : []).filter((x) => ID_RE.test(String(x))).slice(0, 40);
      const out = {};
      for (const f of await R.foMinis(ids)) (out[f.hid] = out[f.hid] || []).push(f.m);
      return { ok: true, minis: out };
    }
    if (a === 'a_fotos') {
      if (!ID_RE.test(String(d.id))) return aErr('datos');
      return { ok: true, fotos: await R.foList(d.id) };
    }
    if (a === 'a_gestion') {
      const id = String(d.id || '');
      const row = ID_RE.test(id) ? await R.hzGet(id) : null;
      if (!row) return aErr('no_existe');
      const v = sxValidarCambios(d.c && typeof d.c === 'object' ? d.c : {});
      if (v.error) return aErr('datos');
      if (v.c.dup_de) {
        const p = await R.hzGet(v.c.dup_de);
        if (!p || p.id === id || p.dup_de || p.borrado) return aErr('datos');
        if ((await R.hzTieneDups(id)) > 0) return aErr('principal');
      }
      const n = sxAplicarCambios(row, v.c, u.nombre, ah.fecha, iso);
      if (n.est === 'cerrado' && !n.cierre_por) n.cierre_por = u.nombre;
      n.act = X.ms;
      await R.hzPut(n);
      return { ok: true, h: n };
    }
    if (a === 'a_foto_cierre') {
      const id = String(d.id || '');
      const row = ID_RE.test(id) ? await R.hzGet(id) : null;
      if (!row) return aErr('no_existe');
      for (const n of (Array.isArray(d.borrar) ? d.borrar : [])) if (n === 11 || n === 12) await R.foDel(id, n);
      for (const f of (Array.isArray(d.fotos) ? d.fotos : []).slice(0, 2)) {
        if (!(f.n === 11 || f.n === 12) || !aFotoOk(f, 420000, 30000)) return aErr('foto');
        await R.foPut(id, f.n, f.d, f.m);
      }
      const fs = await R.foMinis([id], true);
      row.nfc = fs.filter((x) => x.n >= 10).length; row.act = X.ms;
      await R.hzPut(row);
      return { ok: true, nfc: row.nfc };
    }
    if (a === 'a_borrar') {
      const id = String(d.id || '');
      const row = ID_RE.test(id) ? await R.hzGet(id) : null;
      if (!row) return aErr('no_existe');
      row.borrado = d.undo ? 0 : 1; row.act = X.ms;
      row.hist = (row.hist || []).concat([{ t: iso, por: u.nombre, x: d.undo ? 'Restaurado' : 'Eliminado' }]).slice(-60);
      await R.hzPut(row);
      return { ok: true };
    }
    if (a === 'a_usuario') {
      const op = String(d.op || ''), num = sxNum(d.num);
      if (op === 'importar') {
        const cfg = await aCfgGet(R);
        let nuevos = 0, act = 0;
        for (const x of (Array.isArray(d.lista) ? d.lista : []).slice(0, 500)) {
          const n = sxNum(x && x.num), nombre = sxTxt(x && x.nombre, 80);
          if (!n || nombre.length < 2) continue;
          const area = cfg.areas.some((z) => z.n === x.area) ? x.area : sxTxt(x.area, 60);
          const e = await R.userGet(n);
          if (!e) { await R.userPut({ num: n, nombre, area, rol: 'user', estado: 'invitado', sal: '', h: '', cambiar: 0, creado: iso, ult: '', pedido: '' }); nuevos++; }
          else if (e.rol !== 'admin') { e.nombre = nombre; if (area) e.area = area; await R.userPut(e); act++; }
        }
        return { ok: true, nuevos, act };
      }
      if (!num) return aErr('datos');
      const t = await R.userGet(num);
      if (op === 'crear') {
        if (t) return aErr('existe');
        const nombre = sxTxt(d.nombre, 80), clave = String(d.clave || ''), area = sxTxt(d.area, 60);
        if (nombre.length < 3 || !RE_CLAVE.test(clave) || !area) return aErr('datos');
        const sal = aRand(16);
        await R.userPut({ num, nombre, area, rol: 'user', estado: 'activo', sal, h: await aHashClave(sal, clave), cambiar: 1, creado: iso, ult: '', pedido: '' });
        return { ok: true };
      }
      if (!t) return aErr('no_existe');
      if (op === 'editar') {
        const nombre = sxTxt(d.nombre, 80), area = sxTxt(d.area, 60);
        if (nombre.length < 2 || !area) return aErr('datos');
        t.nombre = nombre; t.area = area; await R.userPut(t);
        return { ok: true };
      }
      if (op === 'clave') {
        if (!RE_CLAVE.test(String(d.clave || ''))) return aErr('datos');
        t.sal = aRand(16); t.h = await aHashClave(t.sal, d.clave); t.cambiar = t.num === u.num ? 0 : 1; t.pedido = '';
        if (t.estado === 'invitado') t.estado = 'activo';
        await R.userPut(t); if (t.num !== u.num) await R.sesDelUser(t.num);
        return { ok: true };
      }
      if (op === 'estado') {
        if (t.num === u.num || !['activo', 'baja', 'pendiente'].includes(d.estado)) return aErr('datos');
        if (d.estado === 'activo' && !t.h) return aErr('datos');
        t.estado = d.estado; await R.userPut(t); if (d.estado !== 'activo') await R.sesDelUser(t.num);
        return { ok: true };
      }
      if (op === 'eliminar') {
        if (t.num === u.num) return aErr('datos');
        await R.userDel(t.num); await R.sesDelUser(t.num);
        return { ok: true };
      }
      if (op === 'descartar') { t.pedido = ''; await R.userPut(t); return { ok: true }; }
      return aErr('datos');
    }
    if (a === 'a_cfg') {
      const prev = await aCfgGet(R);
      const c = aCfgSanear(d.cfg);
      if (d.cfg && d.cfg.reg && d.cfg.reg.codigo === undefined) c.reg.codigo = prev.reg.codigo;
      await R.kvPut('cfg', JSON.stringify(c));
      return { ok: true, cfg: aCfgPub(c, true) };
    }
    if (a === 'a_agenda') {
      const f = String(d.fecha || '');
      if (!sxFecha(f)) return aErr('datos');
      const ag = await aAgendaGet(R);
      if (!d.dia) delete ag[f];
      else {
        const x = aDiaSanear(d.dia), o = {};
        if (x.l !== undefined) o.l = x.l; if (x.e) o.e = x.e; if (x.n) o.n = x.n; if (x.g) o.g = x.g;
        if (Object.keys(o).length) ag[f] = o; else delete ag[f];
      }
      const ks = Object.keys(ag).sort(); if (ks.length > 800) for (const k of ks.slice(0, ks.length - 800)) delete ag[k];
      await R.kvPut('agenda', JSON.stringify(ag));
      return { ok: true, agenda: ag };
    }
    if (a === 'a_asistir') {
      const f = String(d.fecha || ''), area = sxTxt(d.area, 60);
      if (!sxFecha(f) || !area) return aErr('datos');
      if (d.on) await R.asiPut({ fecha: f, area, num: 'manual', nombre: sxTxt(d.nombre, 80) || 'Registrado por administración', fuente: 'manual' });
      else await R.asiQuitar(f, area);
      return { ok: true };
    }
    if (a === 'a_respaldo') {
      const pag = Math.max(0, Math.floor(Number(d.pag)) || 0);
      if (pag === 0) {
        const cfg = await aCfgGet(R);
        return {
          ok: true, v: GW_VER, hz: await R.hzList({ desde: '' }), usr: (await R.userAll()).filter((x) => x.rol !== 'admin').map(aUserPub),
          asi: await R.asiList(''), cfg, agenda: await aAgendaGet(R), mas: true,
        };
      }
      const fo = await R.foPage((pag - 1) * 12, 12);
      return { ok: true, fo, mas: fo.length === 12 };
    }
    if (a === 'a_importar') {
      let hz = 0, us = 0, fo = 0, asi = 0;
      for (const r of (Array.isArray(d.hz) ? d.hz : []).slice(0, 2000)) { const n = aHzNormal(r); if (n) { await R.hzPut(n); hz++; } }
      for (const x of (Array.isArray(d.usr) ? d.usr : []).slice(0, 600)) {
        const n = sxNum(x && x.num), nombre = sxTxt(x && x.nombre, 80);
        if (!n || nombre.length < 2 || (await R.userGet(n))) continue;
        await R.userPut({ num: n, nombre, area: sxTxt(x.area, 60), rol: 'user', estado: 'invitado', sal: '', h: '', cambiar: 0, creado: iso, ult: '', pedido: '' }); us++;
      }
      for (const x of (Array.isArray(d.asi) ? d.asi : []).slice(0, 5000)) {
        if (!x || !sxFecha(x.fecha) || !x.area) continue;
        await R.asiPut({ fecha: x.fecha, area: sxTxt(x.area, 60), num: sxTxt(x.num, 20) || 'manual', nombre: sxTxt(x.nombre, 80), fuente: x.fuente === 'sin_novedad' ? 'sin_novedad' : 'manual' }); asi++;
      }
      for (const f of (Array.isArray(d.fo) ? d.fo : []).slice(0, 30)) {
        if (ID_RE.test(String(f && f.hid)) && Number.isInteger(f.n) && f.n > 0 && f.n < 20 && aFotoOk(f, 420000, 30000)) { await R.foPut(f.hid, f.n, f.d, f.m); fo++; }
      }
      if (d.cfg) await R.kvPut('cfg', JSON.stringify(aCfgSanear(d.cfg)));
      if (d.agenda && typeof d.agenda === 'object') {
        const ag = {};
        for (const k of Object.keys(d.agenda).slice(0, 800)) if (sxFecha(k)) { const x = aDiaSanear(d.agenda[k]), o = {}; if (x.l !== undefined) o.l = x.l; if (x.e) o.e = x.e; if (x.n) o.n = x.n; if (x.g) o.g = x.g; ag[k] = o; }
        await R.kvPut('agenda', JSON.stringify(ag));
      }
      return { ok: true, hz, us, fo, asi };
    }
    if (a === 'a_borrar_todo') {
      if (d.conf !== 'BORRAR') return aErr('datos');
      await R.todoBorrar(!!d.agenda);
      return { ok: true };
    }
    return aErr('accion');
  } catch (e) {
    return { ok: false, error: 'servidor', msg: String(e && e.message || e).slice(0, 200) };
  }
}

/* ===== ALMACÉN EN MEMORIA (+ IndexedDB si existe): modo local del navegador y pruebas ===== */
function RepoMem(persist, estado) {
  const S = estado || { usr: {}, ses: {}, rl: {}, hz: {}, asi: {}, kv: {} };
  const FO = {};
  const cp = (x) => (x == null ? x : JSON.parse(JSON.stringify(x)));
  let tmr = null;
  const guardar = () => {
    if (!persist) return;
    clearTimeout(tmr);
    tmr = setTimeout(() => { try { persist.saveS(S); } catch (e) { /* sin persistencia */ } }, 250);
  };
  const orden = (a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : a.hora < b.hora ? 1 : a.hora > b.hora ? -1 : a.id < b.id ? 1 : -1);
  const R = {
    S, FO,
    async userGet(num) { return cp(S.usr[num]) || null; },
    async userPut(u) { S.usr[u.num] = cp(u); guardar(); },
    async userDel(num) { delete S.usr[num]; guardar(); },
    async userAll() { return Object.values(S.usr).map(cp).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')); },
    async adminCount() { return Object.values(S.usr).filter((u) => u.rol === 'admin' && u.estado === 'activo').length; },
    async sesGet(th) { return cp(S.ses[th]) || null; },
    async sesPut(s) { S.ses[s.th] = { th: s.th, num: s.num, exp: s.exp }; guardar(); },
    async sesDel(th) { delete S.ses[th]; guardar(); },
    async sesDelUser(num) { for (const k of Object.keys(S.ses)) if (S.ses[k].num === num) delete S.ses[k]; guardar(); },
    async sesLimpiar(ms) {
      for (const k of Object.keys(S.ses)) if (S.ses[k].exp < ms) delete S.ses[k];
      for (const k of Object.keys(S.rl)) if (S.rl[k].t < ms - 3600e3) delete S.rl[k];
    },
    async rlGet(k) { return cp(S.rl[k]) || null; },
    async rlPut(k, n, t) { S.rl[k] = { n, t }; },
    async rlDel(k) { delete S.rl[k]; },
    async hzGet(id) { return cp(S.hz[id]) || null; },
    async hzPut(r) { S.hz[r.id] = cp(r); guardar(); },
    async hzPutConFotos(r, fotos) {
      S.hz[r.id] = cp(r);
      for (const f of fotos) await R.foPut(r.id, f.n, f.d, f.m);
      guardar();
    },
    async hzList(o) {
      return Object.values(S.hz).filter((r) => (!o.desde || r.fecha >= o.desde) && (!o.hasta || r.fecha <= o.hasta) && (!o.num || r.num === o.num)).sort(orden).map(cp);
    },
    async hzTieneDups(id) { return Object.values(S.hz).filter((r) => r.dup_de === id && !r.borrado).length; },
    async foList(hid) {
      return Object.keys(FO).filter((k) => k.startsWith(hid + '|')).map((k) => ({ n: Number(k.split('|')[1]), d: FO[k].d, m: FO[k].m })).sort((a, b) => a.n - b.n);
    },
    async foPut(hid, n, d, m) { FO[hid + '|' + n] = { d, m }; if (persist) try { persist.foPut(hid + '|' + n, { d, m }); } catch (e) { /* */ } },
    async foDel(hid, n) { delete FO[hid + '|' + n]; if (persist) try { persist.foDel(hid + '|' + n); } catch (e) { /* */ } },
    async foMinis(ids, todas) {
      const out = [];
      for (const id of ids) for (const k of Object.keys(FO)) if (k.startsWith(id + '|')) { const n = Number(k.split('|')[1]); if (todas || n < 10) out.push({ hid: id, n, m: FO[k].m }); }
      return out.sort((a, b) => (a.hid < b.hid ? -1 : a.hid > b.hid ? 1 : a.n - b.n));
    },
    async foPage(off, lim) {
      return Object.keys(FO).sort().slice(off, off + lim).map((k) => ({ hid: k.split('|')[0], n: Number(k.split('|')[1]), d: FO[k].d, m: FO[k].m }));
    },
    async asiList(desde) { return Object.values(S.asi).filter((r) => r.fecha >= (desde || '')).map(cp).sort((a, b) => (a.fecha < b.fecha ? -1 : 1)); },
    async asiPut(r) { S.asi[r.fecha + '|' + r.area + '|' + r.num] = { fecha: r.fecha, area: r.area, num: r.num, nombre: r.nombre || '', fuente: r.fuente || '' }; guardar(); },
    async asiQuitar(f, area) { for (const k of Object.keys(S.asi)) if (S.asi[k].fecha === f && S.asi[k].area === area) delete S.asi[k]; guardar(); },
    async kvGet(k) { return S.kv[k] == null ? null : S.kv[k]; },
    async kvPut(k, v) { S.kv[k] = v; guardar(); },
    async todoBorrar(conAgenda) {
      S.hz = {}; S.asi = {};
      for (const k of Object.keys(FO)) { delete FO[k]; }
      if (persist) try { persist.foClear(); } catch (e) { /* */ }
      if (conAgenda) delete S.kv.agenda;
      guardar();
    },
  };
  return R;
}

/* ===== NÚCLEO DEL CLIENTE: utilidades, fechas, rotación, fotos, diálogos ===== */
'use strict';
const S = { modo: '', tk: '', user: null, cfg: null, agenda: {}, hoy: '', vista: '', sec: 'resumen', info: {} };
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function h(tag, a, ...kids) {
  const el = document.createElement(tag);
  if (a) {

/* ---------- asistencia y estado de cada día ---------- */
function presentes(f) { return A.pres[f] || {}; }

function estadoDia(f) {

}
function fechasEntre(d, h) { const o = []; for (let f = d; f <= h; f = sxSuma(f, 1)) { o.push(f); if (o.length > 900) break; } return o; }
function asistenciaDe(f) {

}
function rango(clave) {

function caminatas(desde, hasta) {
  const hoy = A.hoy, res = [];
  for (const f of fechasEntre(desde, hasta)) {
    const st = estadoDia(f);

function cobertura(ref) {
  const R0 = S.cfg.rotacion, dd = diff(R0.inicio, ref);

}

/* ---------- repetidos (misma falla en días distintos) ---------- */
function tokensDe(x) { return x._tk || (x._tk = sxTokens((x.que || '') + ' ' + (x.comentario || ''))); }

  const arr = lista.slice().sort((a, b) => (a.fecha + a.hora < b.fecha + b.hora ? -1 : 1)), porLugar = {}, rep = new Map();
  for (const a of arr) {
    const grp = (porLugar[a.lugar] = porLugar[a.lugar] || []);
    for (const b of grp) {

      if ((a.que && a.que === b.que) || jacc(tokensDe(a), tokensDe(b)) >= 0.5) { rep.set(a.id, b.id); break; }

function kpis(desde, hasta) {

  const aTiempo = conComp.filter((x) => x.est === 'cerrado' && x.cierre && x.cierre <= x.comp);
  const rep = repetidosDe(hzContados().filter((x) => x.fecha <= hasta && x.tipo !== 'Buena práctica'));
  const repPer = per.filter((x) => rep.has(x.id));

async function enviarHallazgo() {
  if (!R.listo()) return;
  R.enviando = true; const b = $('#enviar'); if (b) { b.disabled = true; b.textContent = 'Enviando…'; }
  const ah = sxAhoraMX();
  const lugar = R.otro ? R.otroTxt.trim() : R.lugar;
  const body = {
    id: nuevoId(), fecha: ah.fecha, hora: ah.hora, tipo: R.tipo, lugar, lid: R.otro ? 0 : R.lid, que: R.que, comentario: R.comentario.trim(), urgente: R.urgente ? 1 : 0,
    crit: R.qd ? R.qd.crit : '', muda: R.qd ? R.qd.muda : '', resp_area: R.qd && R.qd.area ? R.qd.area : (TIPOS_DEF.find((t) => t.n === R.tipo) || {}).area || '',
    fotos: R.fotos.filter((f) => f.d).map((f) => ({ d: f.d, m: f.m })),
  };
  // ¿ya lo reportó alguien más hoy?
  if (Net.modo === 'local' || Net.estado !== 'sin') {
    const s = await Net.llamar('similares', { fecha: ah.fecha, lugar, tipo: R.tipo, que: R.que, comentario: body.comentario }, { ms: 6000 });
    if (s.ok && s.s.length) {
      const el = await preguntarSimilar(s.s);
      if (el === 'cancel') { R.enviando = false; if (b) { b.disabled = false; b.textContent = 'Enviar hallazgo'; } return; }
      if (el) body.dup_de = el;
    }
  }
  const r = await Net.llamar('hallazgo', body, { ms: 60000 });
  if (r.ok) return exitoEnvio(body, false);
  if (r.error === 'red') { await Cola.agregar('hallazgo', body, S.user.num); return exitoEnvio(body, true); }
  R.enviando = false; if (b) { b.disabled = false; b.textContent = 'Enviar hallazgo'; }
  if (r.error !== 'sesion') aviso(errTxt(r), true);
}

async function fotoReporte(d) {

  const k = Math.min(1, 640 / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.max(1, Math.round(im.naturalWidth * k)), hh = Math.max(1, Math.round(im.naturalHeight * k));

async function fotosDe(items, max) { // items: hallazgos en el orden en que deben aparecer

  let i = 0;

    while (i < cola.length) {
      const k = i++, x = cola[k], salida = [];
      try {
        const r = await Net.llamar('a_fotos', { id: x.id }, { ms: 40000 });
        if (r.ok) {
          const ant = r.fotos.filter((f) => f.n < 10).sort((a, b) => a.n - b.n).slice(0, x.crit === 'alta' || x.urgente ? 2 : 1);
          const cie = r.fotos.filter((f) => f.n >= 10).sort((a, b) => a.n - b.n).slice(0, 1);
          for (const f of ant.concat(cie)) {
            const key = x.id + ':' + f.n;
            if (!A.fcache[key]) A.fcache[key] = await fotoReporte(f.d);
            salida.push(Object.assign({}, A.fcache[key], { cap: (f.n >= 10 ? 'Cierre · ' : (esAbierto(x) && (x.urgente || x.crit === 'alta') ? 'Crítico · ' : '')) + x.lugar + ' · ' + corto(descHz(x), 70) }));
          }

  };

}

async function descargarRespaldo(conFotos) {
  aviso('Preparando respaldo…');
  const r = await Net.llamar('a_respaldo', { pag: 0 }, { ms: 120000 });
  if (!r.ok) return aviso(errTxt(r), true);
  const out = { v: GW_VER, fecha: new Date().toISOString(), hz: r.hz, usr: r.usr, asi: r.asi, cfg: r.cfg, agenda: r.agenda, fo: [] };
  if (conFotos) {
    for (let p = 1; p < 400; p++) {
      const f = await Net.llamar('a_respaldo', { pag: p }, { ms: 120000 });
      if (!f.ok) return aviso(errTxt(f), true);
      out.fo.push(...f.fo); if (!f.mas) break;
    }
  }
  bajar('respaldo-gemba-' + HOY() + (conFotos ? '' : '-sin-fotos') + '.json', JSON.stringify(out), 'application/json');
  aviso('Respaldo descargado ✓');
}
async function restaurarRespaldo(ev) {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  let o; try { o = JSON.parse(await f.text()); } catch (e) { return aviso('Ese archivo no es un respaldo válido.', true); }
  if (!o || !Array.isArray(o.hz)) return aviso('Ese archivo no es un respaldo de Hallazgos Gemba.', true);
  if (!(await confirmar('¿Restaurar respaldo?', plural(o.hz.length, 'hallazgo') + ' y ' + plural((o.fo || []).length, 'foto') + '. Se suman a lo que ya hay; los que tengan el mismo ID se reemplazan.', 'Restaurar'))) return;
  aviso('Restaurando…');
  const r0 = await Net.llamar('a_importar', { hz: o.hz.slice(0, 2000), usr: o.usr, asi: o.asi, cfg: o.cfg, agenda: o.agenda }, { ms: 120000 });

function generarEjemplo() {
  const rnd = prng(20261119), ri = (n) => Math.floor(rnd() * n), pick = (a) => a[ri(a.length)];
  const hoy = A.hoy, ini = diff(S.cfg.rotacion.inicio, hoy) >= 0 ? S.cfg.rotacion.inicio : sxSuma(hoy, -28);

  const porArea = {}; DEMO_PERSONAS.forEach(([num, nombre, area]) => { porArea[area] = { num, nombre, area }; });

  const pesoArea = { 'Calidad': 0.95, 'Seguridad Industrial': 0.95, 'Producción': 0.9, 'Mantenimiento': 0.88, 'Excelencia Operativa': 0.85, 'Almacén de PT': 0.85, 'Compras': 0.5, 'Talento Humano': 0.6, 'Planeación': 0.6, 'Jarabes': 0.8 };
  const tipoDeArea = { 'Calidad': 'Calidad', 'Seguridad Industrial': 'Seguridad', 'Mantenimiento': 'Infraestructura', 'Tratamiento de aguas': 'Medio ambiente', 'Servicios Auxiliares': 'Medio ambiente' };
  const tiposW = [['Seguridad', 22], ['Calidad', 20], ['Orden y limpieza', 20], ['Operación', 12], ['Infraestructura', 12], ['Medio ambiente', 8], ['Buena práctica', 6]];
  const tipoRand = () => { let t = rnd() * 100; for (const [n, w] of tiposW) { if ((t -= w) < 0) return n; } return 'Calidad'; };

  const recurrentes = [];
  for (const f of fechasEntre(ini, hoy)) {
    if (!esLaborable(f) || !rotPlan(f) || rnd() > 0.95) continue;
    const ruta = rutaDe(f).ids, lugs = ruta.map(lugarPorId).filter(Boolean), esHoy = f === hoy;
    for (const area of conv) {
      if (rnd() > (pesoArea[area] || 0.75) * (esHoy ? 0.45 : 1)) continue;

      const n = (() => { const r = rnd(); return r < 0.2 ? 0 : r < 0.62 ? 1 : r < 0.88 ? 2 : 3; })();
      if (!n) { if (rnd() < 0.6) asi.push({ fecha: f, area, num: per.num, nombre: per.nombre, fuente: 'sin_novedad' }); continue; }

        let tipo = tipoDeArea[area] && rnd() < 0.5 ? tipoDeArea[area] : tipoRand();
        let lug = lugs.length && rnd() < 0.78 ? pick(lugs) : pick(S.cfg.lugares.filter((l) => l.on));
        let it = null;
        const cand = REVISA_DEF.filter((x) => x.tipo === tipo && (!x.g.length || x.g.includes(lug.g)));
        if (cand.length && rnd() < 0.85) it = pick(cand);
        if (!it && recurrentes.length && rnd() < 0.12) { const r0 = pick(recurrentes); it = r0.it; lug = r0.lug; tipo = r0.tipo; }
        const hh = String(8 + ri(4)).padStart(2, '0') + ':' + String(ri(60)).padStart(2, '0');
        const buena = tipo === 'Buena práctica';
        const crit = buena ? '' : it && it.crit && rnd() < 0.85 ? it.crit : pick(['alta', 'media', 'media', 'baja', 'baja']);
        const edad = diff(f, hoy);
        let est = 'abierto', cierre = '', tc = '', accion = '', plan = '', comp = '', cierrePor = '';
        if (buena) { est = 'cerrado'; cierre = f; tc = 'sitio'; accion = 'Se reconoció al equipo'; cierrePor = 'Arlette (demo)'; }
        else {

            const r1 = rnd();

          }

          if (est !== 'cerrado' && crit === 'alta') plan = pick(DEMO_PLAN);
          if (edad <= 2 && rnd() < 0.5) { /* aún sin clasificar */ }

        const id = idDe(f, hh), [yy, mm, dd] = f.split('-').map(Number), ms = Date.UTC(yy, mm - 1, dd, Number(hh.slice(0, 2)) + 6, Number(hh.slice(3)));
        const nf = rnd() < 0.38 ? 1 + (rnd() < 0.25 ? 1 : 0) : 0;

        const row = {

          nf, nfc: 0, recibido: ms, est, crit: edad <= 1 && rnd() < 0.35 && est === 'abierto' ? '' : crit, resp_area: buena ? '' : respA, resp_nom: !buena && porArea[respA] && rnd() < 0.7 ? porArea[respA].nombre : '',
          comp, causa: !buena && rnd() < 0.4 ? pick(CAUSAS) : '', muda: it && it.muda ? it.muda : '', accion, plan, cierre, cierre_tipo: tc, cierre_por: cierrePor, nota: '', dup_de: '', hist: [], borrado: 0, act: ms,
        };
        hz.push(row);

        if (it && !buena && rnd() < 0.18 && recurrentes.length < 6) recurrentes.push({ it, lug, tipo });

          const otra = pick(DEMO_PERSONAS.filter((p) => p[2] !== area)), hh2 = String(8 + ri(4)).padStart(2, '0') + ':' + String(ri(60)).padStart(2, '0');
          hz.push(Object.assign({}, row, { id: idDe(f, hh2), hora: hh2, num: otra[0], nombre: otra[1], area: otra[2], dup_de: id, nf: 0, comentario: '', est: 'abierto', cierre: '', cierre_tipo: '', cierre_por: '', accion: '', plan: '', comp: '', crit: '', resp_area: '', resp_nom: '' }));
        }
